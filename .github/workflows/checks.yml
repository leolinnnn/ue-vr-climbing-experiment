name: Archive integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python inspect_assets.py
